const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const GROUND_H = 80, SKY_H = H - GROUND_H;

/* ---------- assets ---------- */
const birdImg = new Image(); birdImg.src = BIRD_SRC;
const deathImg = new Image(); deathImg.src = DEATH_SRC;
let loaded = 0;
[birdImg, deathImg].forEach(im => { im.onload = () => { loaded++; }; });

/* ---------- audio ---------- */
let AC = null;
function beep(freq, dur, type, vol){
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type||'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol||0.06, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  }catch(e){}
}
const sFlap  = () => beep(620, .09, 'square', .05);
const sScore = () => { beep(880,.08,'square',.05); setTimeout(()=>beep(1320,.10,'square',.05),70); };
const sHit   = () => { beep(180,.18,'sawtooth',.09); setTimeout(()=>beep(90,.35,'sawtooth',.08),120); };

/* ---------- tuning ---------- */
const GRAV = 0.46, FLAP = -8.0, MAXFALL = 12;
const BW = 46, BH = Math.round(46 * 426/190);       // sprite aspect
const PIPE_W = 66, GAP = 190, PIPE_SPACING = 235;
const SPEED = 2.6;

/* ---------- state ---------- */
const STATE = { READY:0, PLAY:1, DEAD:2 };
let state, bird, pipes, score, best = 0, frames, groundX, shake, flashA, deathT, clouds;

function reset(){
  state = STATE.READY;
  bird = { x: 96, y: SKY_H*0.42, v: 0, rot: 0 };
  pipes = [];
  score = 0; frames = 0; groundX = 0; shake = 0; flashA = 0; deathT = 0;
  clouds = [];
  for(let i=0;i<5;i++) clouds.push({x: Math.random()*W, y: 40 + Math.random()*220,
                                    s: 0.25 + Math.random()*0.35, r: 26 + Math.random()*26});
  for(let i=0;i<3;i++) addPipe(W + 180 + i*PIPE_SPACING);
}
function addPipe(x){
  const margin = 70;
  const top = margin + Math.random() * (SKY_H - GAP - margin*2);
  pipes.push({ x, top, passed:false });
}

function flap(){
  if(state === STATE.READY){ state = STATE.PLAY; bird.v = FLAP; sFlap(); return; }
  if(state === STATE.PLAY){ bird.v = FLAP; sFlap(); return; }
  if(state === STATE.DEAD && deathT > 40){ reset(); }
}

/* ---------- input ---------- */
function onDown(e){ e.preventDefault(); flap(); }
cv.addEventListener('mousedown', onDown);
cv.addEventListener('touchstart', onDown, {passive:false});
window.addEventListener('keydown', e => {
  if(e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW'){ e.preventDefault(); flap(); }
  if(e.code === 'KeyR' && state === STATE.DEAD) reset();
});

/* ---------- collision ---------- */
function hitbox(){
  // forgiving box around the torso/head, not the full tall sprite
  return { x: bird.x - BW*0.34, y: bird.y - BH*0.42, w: BW*0.68, h: BH*0.84 };
}
function overlaps(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

function die(){
  if(state === STATE.DEAD) return;
  state = STATE.DEAD; deathT = 0; shake = 18; flashA = 0.85;
  if(score > best) best = score;
  sHit();
}

/* ---------- update ---------- */
function update(){
  frames++;
  if(state !== STATE.DEAD) groundX = (groundX + SPEED) % 40;

  if(state === STATE.READY){
    bird.y = SKY_H*0.42 + Math.sin(frames/18)*10;
    bird.rot = Math.sin(frames/18)*0.08;
    for(const cl of clouds){ cl.x -= cl.s; if(cl.x < -80) cl.x = W + 60; }
    return;
  }

  if(state === STATE.PLAY){
    bird.v = Math.min(bird.v + GRAV, MAXFALL);
    bird.y += bird.v;
    bird.rot = Math.max(-0.45, Math.min(1.3, bird.v/14));

    for(const cl of clouds){ cl.x -= cl.s; if(cl.x < -80) cl.x = W + 60; }

    for(const p of pipes) p.x -= SPEED;
    if(pipes.length && pipes[0].x < -PIPE_W){ pipes.shift(); addPipe(pipes[pipes.length-1].x + PIPE_SPACING); }

    const hb = hitbox();
    for(const p of pipes){
      const topBox = { x:p.x, y:0, w:PIPE_W, h:p.top };
      const botBox = { x:p.x, y:p.top+GAP, w:PIPE_W, h:SKY_H-(p.top+GAP) };
      if(overlaps(hb, topBox) || overlaps(hb, botBox)) die();
      if(!p.passed && p.x + PIPE_W < bird.x){ p.passed = true; score++; sScore(); }
    }
    if(hb.y + hb.h >= SKY_H){ bird.y = SKY_H - hb.h + BH*0.42; die(); }
    if(hb.y < -30){ bird.y = -30 + BH*0.42; bird.v = 0; }
    return;
  }

  // DEAD
  deathT++;
  if(bird.y < SKY_H - BH*0.40){
    bird.v = Math.min(bird.v + GRAV*1.3, MAXFALL+4);
    bird.y += bird.v;
    bird.rot = Math.min(1.6, bird.rot + 0.09);
  }
  shake *= 0.88; flashA *= 0.88;
}

/* ---------- draw ---------- */
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function textC(t, x, y, size, fill, stroke, weight){
  ctx.font = (weight||'bold') + ' ' + size + 'px "Trebuchet MS", Verdana, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if(stroke){ ctx.lineWidth = Math.max(3, size/7); ctx.strokeStyle = stroke;
              ctx.lineJoin = 'round'; ctx.strokeText(t, x, y); }
  ctx.fillStyle = fill; ctx.fillText(t, x, y);
}

function drawPipe(p){
  const bodyG = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
  bodyG.addColorStop(0,'#3c8f2e'); bodyG.addColorStop(.28,'#8fdc6a');
  bodyG.addColorStop(.62,'#5cb43f'); bodyG.addColorStop(1,'#2c6b20');
  const LIP = 26, LW = PIPE_W + 12;

  // top pipe
  ctx.fillStyle = bodyG; ctx.fillRect(p.x, 0, PIPE_W, p.top - LIP);
  ctx.fillRect(p.x - 6, p.top - LIP, LW, LIP);
  // bottom pipe
  const by = p.top + GAP;
  ctx.fillRect(p.x, by + LIP, PIPE_W, SKY_H - by - LIP);
  ctx.fillRect(p.x - 6, by, LW, LIP);

  ctx.strokeStyle = '#1f4f16'; ctx.lineWidth = 2.5;
  ctx.strokeRect(p.x+1, -2, PIPE_W-2, p.top - LIP + 2);
  ctx.strokeRect(p.x-5, p.top - LIP, LW-2, LIP);
  ctx.strokeRect(p.x+1, by + LIP, PIPE_W-2, SKY_H - by - LIP + 4);
  ctx.strokeRect(p.x-5, by, LW-2, LIP);
}

function drawBird(){
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);
  // soft shadow
  ctx.save();
  ctx.globalAlpha = .18; ctx.filter = 'blur(2px)';
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(0, BH*0.44, BW*0.34, BH*0.06, 0, 0, 7); ctx.fill();
  ctx.restore();
  if(loaded >= 1 && birdImg.complete && birdImg.naturalWidth){
    ctx.drawImage(birdImg, -BW/2, -BH*0.5, BW, BH);
  } else {
    ctx.fillStyle = '#f5c542';
    roundRect(-BW/2, -BH*0.5, BW, BH, 10); ctx.fill();
  }
  ctx.restore();
}

function drawGround(){
  const y = SKY_H;
  ctx.fillStyle = '#ded08a'; ctx.fillRect(0, y, W, GROUND_H);
  ctx.fillStyle = '#7fc44f'; ctx.fillRect(0, y, W, 16);
  ctx.fillStyle = '#5da33a';
  for(let x = -groundX; x < W; x += 40){
    ctx.beginPath(); ctx.moveTo(x, y+16); ctx.lineTo(x+20, y+16);
    ctx.lineTo(x+12, y+4); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#cbbc73';
  for(let x = -groundX*0.6; x < W; x += 26) ctx.fillRect(x, y+34, 13, 5);
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,y+.5); ctx.lineTo(W,y+.5); ctx.stroke();
}

function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,SKY_H);
  g.addColorStop(0,'#4ec0ea'); g.addColorStop(.65,'#8fd8f2'); g.addColorStop(1,'#cdeef8');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,SKY_H);
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  for(const cl of clouds){
    ctx.beginPath();
    ctx.arc(cl.x, cl.y, cl.r, 0, 7);
    ctx.arc(cl.x + cl.r*0.85, cl.y + 6, cl.r*0.72, 0, 7);
    ctx.arc(cl.x - cl.r*0.85, cl.y + 8, cl.r*0.62, 0, 7);
    ctx.fill();
  }
}

function drawDeathScreen(){
  const t = Math.min(1, deathT/16);
  ctx.fillStyle = 'rgba(0,0,0,' + (0.72*t) + ')'; ctx.fillRect(0,0,W,H);

  const pad = 22, iw = W - pad*2;
  const ih = deathImg.naturalHeight ? iw * deathImg.naturalHeight/deathImg.naturalWidth : iw*0.75;
  const iy = 92;
  const pop = 0.86 + 0.14*t;

  ctx.save();
  ctx.translate(W/2, iy + ih/2); ctx.scale(pop, pop); ctx.globalAlpha = t;
  if(deathImg.complete && deathImg.naturalWidth){
    ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 26;
    ctx.drawImage(deathImg, -iw/2, -ih/2, iw, ih);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
    ctx.strokeRect(-iw/2, -ih/2, iw, ih);
  }
  ctx.restore();

  ctx.globalAlpha = t;
  textC('GAME OVER', W/2, 56, 44, '#ffd23f', '#7a2b00');

  const panelY = iy + ih + 22;
  ctx.fillStyle = 'rgba(255,255,255,.94)';
  roundRect(W/2 - 130, panelY, 260, 104, 16); ctx.fill();
  ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 4; ctx.stroke();

  ctx.font = 'bold 17px "Trebuchet MS", Verdana, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#8a6b1f';
  ctx.fillText('SCORE', W/2 - 108, panelY + 32);
  ctx.fillText('BEST',  W/2 - 108, panelY + 74);
  ctx.textAlign = 'right'; ctx.fillStyle = '#333';
  ctx.font = 'bold 30px "Trebuchet MS", Verdana, sans-serif';
  ctx.fillText(String(score), W/2 + 108, panelY + 32);
  ctx.fillText(String(best),  W/2 + 108, panelY + 74);

  if(deathT > 40){
    const pulse = 0.7 + 0.3*Math.sin(deathT/9);
    ctx.globalAlpha = t * pulse;
    textC('TAP / SPACE TO RETRY', W/2, panelY + 142, 20, '#ffffff', '#000');
  }
  ctx.globalAlpha = 1;
}

function drawHUD(){
  if(state === STATE.READY){
    textC('FLAPPY MKB', W/2, 96, 40, '#ffd23f', '#7a2b00');
    const pulse = 0.72 + 0.28*Math.sin(frames/12);
    ctx.globalAlpha = pulse;
    textC('TAP  /  SPACE  TO  FLY', W/2, SKY_H - 108, 20, '#fff', '#1a3b52');
    ctx.globalAlpha = 1;
  } else if(state === STATE.PLAY){
    textC(String(score), W/2, 72, 54, '#fff', '#1a3b52');
  }
}

function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  if(shake > 0.4){
    ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);
  }
  drawSky();
  for(const p of pipes) drawPipe(p);
  drawGround();
  drawBird();
  ctx.setTransform(1,0,0,1,0,0);
  drawHUD();
  if(flashA > 0.02){ ctx.fillStyle = 'rgba(255,255,255,'+flashA+')'; ctx.fillRect(0,0,W,H); }
  if(state === STATE.DEAD) drawDeathScreen();
}

function loop(){ update(); render(); requestAnimationFrame(loop); }
reset(); loop();
})();
</script>
</body>
